<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" data-theme-preset="tobias-lanches">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description"
    content="Painel administrativo oficial do Tobia's Lanches para gerenciamento do cardápio online.">
  <meta name="theme-color" content="#030303">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Painel - Tobia's Lanches</title>
  <style>
    /* CARREGAMENTO | Mantem o fundo e a tela inicial prontos antes do CSS principal terminar de carregar. */
    html {
      color-scheme: dark;
      background: #030303;
      color: #fffdf4;
    }

    body {
      margin: 0;
      background: #030303;
      color: #fffdf4;
    }

    .page-transition-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      width: 100vw;
      height: 100vh;
      min-height: 100dvh;
      background: #030303;
      color: #fffdf4;
    }

    .page-transition-card {
      display: grid;
      justify-items: center;
      gap: 18px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      opacity: 0;
      transform: translateY(10px);
      animation: page-transition-card-in 420ms cubic-bezier(0.2, 0.72, 0.18, 1) 80ms both;
    }

    .page-transition-kicker {
      display: none;
    }

    .page-transition-title {
      color: rgba(255, 253, 244, 0.92);
      font-size: 0.94rem;
      font-weight: 600;
      line-height: 1.25;
    }

    .page-transition-loader {
      position: relative;
      display: grid;
      place-items: center;
      width: 94px;
      height: 94px;
      border-radius: 50%;
      box-shadow:
        0 0 0 1px rgba(255, 196, 0, 0.07),
        0 0 34px rgba(255, 196, 0, 0.08);
    }

    .page-transition-logo {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      animation: page-transition-logo-breathe 1800ms ease-in-out infinite;
    }

    .page-transition-loader > span {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0 54%, rgba(255, 196, 0, 0.2) 68%, #ffc400 82%, transparent 100%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
      animation: page-transition-loader 1150ms linear infinite;
    }

    @keyframes page-transition-card-in {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes page-transition-logo-breathe {
      50% {
        transform: scale(1.025);
      }
    }

    @keyframes page-transition-loader {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .page-transition-card,
      .page-transition-logo,
      .page-transition-loader > span {
        animation: none !important;
        transform: none !important;
      }
    }
  </style>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="./assets/favicon.png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="preload" as="font" type="font/woff2" crossorigin
    href="./assets/fonts/bebas-neue-latin.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin
    href="./assets/fonts/manrope-latin-variable.woff2">
  <link rel="stylesheet" href="./dist/styles.css?v=2.0.35">
</head>

<body class="admin-page page-transition-active">
  <!-- CARREGAMENTO | Mostra uma entrada visual enquanto autenticacao, estado e painel ficam prontos. -->
  <div id="templatePageTransition" class="page-transition-overlay page-transition-overlay--show" aria-hidden="false">
    <div class="page-transition-card" role="status" aria-live="polite">
      <span class="page-transition-kicker" data-page-transition-brand>Tobia's Lanches</span>
      <strong class="page-transition-title" data-page-transition-message>Carregando Admin</strong>
      <span class="page-transition-loader" aria-hidden="true">
        <img class="page-transition-logo" src="./assets/NovaLogoTobias.png" alt="" decoding="async">
        <span></span>
      </span>
    </div>
  </div>

  <!-- ADMIN | Estrutura fixa do painel; o JavaScript preenche login e secoes dentro dela. -->
  <main class="admin-shell">
    <!-- TOPO ADMIN | Reune titulo, link para o cardapio publico, idioma e saida da sessao. -->
    <header class="admin-topo">
      <div>
        <p class="admin-kicker">Painel</p>
        <h1 class="admin-title">Gerenciar cardápio</h1>
        <p class="admin-subtitle">Painel oficial do Tobia's Lanches.</p>
      </div>
      <div class="admin-topbar-actions">
        <a class="botao botao-secundario admin-public-link" href="index.html">Ver cardápio público</a>
        <label class="idioma-box idioma-box-admin" for="adminLocaleSelector">
          <span class="idioma-rotulo" id="adminLocaleLabel">Idioma</span>
          <select id="adminLocaleSelector" class="idioma-seletor" aria-label="Selecionar idioma"></select>
        </label>
        <button id="logoutButton" type="button" class="botao botao-secundario" hidden>Sair</button>
      </div>
    </header>

    <!-- PAINEL DINAMICO | Status, login e conteudo principal mudam conforme sessao e aba ativa. -->
    <p id="adminStatus" class="admin-status" aria-live="polite"></p>
    <section id="authPanel" class="admin-card"></section>
    <section id="adminApp" hidden></section>
  </main>

  <!-- SCRIPTS | Carrega configuracao, utilitarios, autenticacao, estado e painel nesta ordem. -->
  <script src="./config.js?v=1.0.0"></script>
  <script src="./dist/core/shared-utils.js?v=2.1.5"></script>
  <script src="./dist/core/admin-auth.js?v=2.1.0"></script>
  <script src="./dist/core/state-manager.js?v=2.0.5"></script>
  <script src="./dist/admin.js?v=2.0.14"></script>
</body>

</html>
